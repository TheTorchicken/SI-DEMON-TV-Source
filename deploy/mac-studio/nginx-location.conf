# Example location inside your own existing HTTPS server.
location ^~ /sidemon/ {
    # Strip /sidemon/; the application exposes /api/* and /ws/* internally.
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_intercept_errors off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 4m;

    # WebSocket authentication currently uses a query token. Keep request URLs
    # out of gateway logs; inspect the relay's sanitized logs for failures.
    access_log off;
    error_log /dev/null;
}
