name: Verify
on:
  push:
    branches: [main, codex/v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install test transcoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm test
      - run: npm run build
      - run: npm run format:check
      - run: npm audit --audit-level=moderate
